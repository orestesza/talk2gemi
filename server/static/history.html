<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>talk2gemi · 对话记录</title>
<style>
:root{font:16px system-ui;color:#e5ecef;background:#10191e;color-scheme:dark}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #33444c;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0}a{color:#8be3d0}button,input,select{font:inherit;background:#21323b;color:inherit;border:1px solid #48606c;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{background:#304751}main{display:grid;grid-template-columns:290px 1fr;min-height:78vh}aside{padding:18px;border-right:1px solid #33444c}aside button{display:block;text-align:left;width:100%;margin-bottom:9px}.selected{border-color:#78dbc0;background:#29473f}section{padding:24px;max-width:950px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.turn{border:1px solid #344a55;padding:20px;margin:16px 0;border-radius:12px;background:#16242c}.meta,.notice{font-size:13px;color:#a9bec7;line-height:1.7}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.label{color:#7edcc6;margin:14px 0 5px}#notice{color:#ffd28d}#search{flex:1;min-width:150px}@media(max-width:650px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #33444c;max-height:220px;overflow:auto}section{padding:16px}}
</style>
<header><h1>对话记录</h1><a href="/">返回控制台</a><button id="new">新建会话</button><button id="clear">清空全部</button></header>
<main><aside><p class="notice">文字保存在本机。默认不保存录音。选择历史用于回看；点击“继续此会话”才切换模型上下文。</p><div id="sessions"></div></aside><section><div class="bar"><input id="search" placeholder="搜索当前会话"><button id="select">继续此会话</button><button id="delete">删除会话</button><button id="md">导出 Markdown</button><button id="json">导出 JSON</button></div><div id="notice" role="status"></div><p id="current" class="notice"></p><div id="turns"></div></section></main>
<script>
let selected=null,current=null;const $=id=>document.getElementById(id);const labels={recording:'录音中',thinking:'等待回答',retrying:'重连重试中',speaking:'回复中',completed:'完成',timeout:'超时',cancelled:'已取消',interrupted:'已中断',error:'失败'};
async function request(url,options){let r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()}
function element(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function load(){try{let d=await request('/api/conversations');current=d.current;if($('notice').textContent==='Failed to fetch')$('notice').textContent='';if(!d.conversations.some(c=>c.id===selected))selected=current||d.conversations[0]?.id||null;$('sessions').replaceChildren();for(let c of d.conversations){let b=element('button',(c.id===current?'● ':'')+c.title+'\n'+new Date(c.created*1000).toLocaleString(),c.id===selected?'selected':'');b.onclick=()=>{selected=c.id;load()};$('sessions').append(b)}$('current').textContent=selected===current?'当前模型会话':'历史查看模式';await turns()}catch(e){$('notice').textContent=e.message}}
async function turns(){if(!selected){$('turns').replaceChildren(element('p','暂无记录。开始一次设备对话即可。'));return}let d=await request('/api/conversations?id='+encodeURIComponent(selected)+'&q='+encodeURIComponent($('search').value));$('turns').replaceChildren();for(let t of d.turns){let n=element('article',undefined,'turn');n.append(element('div',new Date(t.created*1000).toLocaleString()+' · '+(labels[t.status]||t.status)+' · 重试 '+t.retries+' 次'+(t.latency!=null?' · 首包 '+t.latency+'ms':''),'meta'),element('div','你','label'),element('div',t.user||'（未取得识别文字）','text'),element('div','助手','label'),element('div',t.assistant||'（尚无回答）','text'));if(t.error)n.append(element('p',t.error,'notice'));$('turns').append(n)}}
async function action(action,id){try{$('notice').textContent='处理中…';await request('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id})});if(action==='new')selected=null;$('notice').textContent='';await load()}catch(e){$('notice').textContent=e.message}}
$('new').onclick=()=>action('new');$('select').onclick=()=>selected&&action('select',selected);$('delete').onclick=()=>selected&&confirm('删除此会话的文字记录和记忆？若为当前会话，将重置模型上下文。')&&action('delete',selected);$('clear').onclick=()=>confirm('清空本机全部会话和记忆？此操作无法撤销。')&&action('clear');for(let fmt of ['md','json'])$(fmt).onclick=()=>{if(selected)location.href='/api/conversations?id='+encodeURIComponent(selected)+'&export='+fmt};$('search').oninput=()=>turns().catch(e=>$('notice').textContent=e.message);let socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/dashboard');let timer;socket.onmessage=e=>{if(JSON.parse(e.data).type==='history_changed'){clearTimeout(timer);timer=setTimeout(load,150)}};load();setInterval(load,5000);
</script></html>
